<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulação agrícola portátil</title>
    <link rel="icon" href="data:,">
    <style>
        body { margin: 0; font: 14px system-ui, sans-serif; color: #1d1d1f; background: #f5f5f7; }
        main { max-width: 1200px; margin: auto; padding: 24px; }
        h1 { font-size: 22px; }
        .controles { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
        label { display: flex; align-items: center; gap: 8px; }
        #cena { margin: 16px 0; background: white; border-radius: 20px; overflow: hidden; }
        input { max-width: 50vw; }
        #status { min-height: 20px; }
    </style>
</head>
<body>
    <main>
        <h1>Simulação agrícola portátil</h1>
        <div class="controles">
            <label>Rotação <select id="rotacao"></select></label>
            <label>Dia <input id="dia" type="range" min="0" value="0"><output id="valor-dia">0</output></label>
        </div>
        <div id="cena"></div>
        <p id="status" role="status">Preparando a simulação…</p>
        <p>Arraste para mover. Use a roda do mouse ou os botões para zoom. O percentual restaura o enquadramento.</p>
        <p>Este exemplo usa clima sintético e funciona sem serviços externos.</p>
    </main>
    <script type="module" src="./main.js"></script>
</body>
</html>
